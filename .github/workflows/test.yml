name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          # Skip TDA extras in CI (gudhi build is slow and is exercised
          # via the integration tests that we run locally).
          pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check tcml_workflow scripts tests || true   # warnings only for now

      - name: Run tests
        run: pytest tests/ -v --tb=short
